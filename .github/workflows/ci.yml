name: Student App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: studentdb
          MYSQL_USER: studentuser
          MYSQL_PASSWORD: ci-student-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      DB_PASSWORD: ci-student-password
      SPRING_DATASOURCE_USERNAME: studentuser
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/studentdb?allowPublicKeyRetrieval=true&sslMode=DISABLED"

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build Docker image
        run: docker build -t student-app:ci .

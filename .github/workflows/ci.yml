name: Student App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-student-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      APP_VERSION: ${{ github.sha }}
    steps:
      - name: Download repository code
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test with H2
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate Compose and start MySQL
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait db
      - name: Run API and migration tests against MySQL
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/studentdb?allowPublicKeyRetrieval=true&sslMode=DISABLED
          TEST_DB_USERNAME: studentuser
          TEST_DB_PASSWORD: ci-student-password
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Build and start application container
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build app
      - name: Smoke test running container
        run: python3 scripts/smoke-test.py
      - name: Verify data survives application restart
        run: |
          STUDENT_ID=$(curl --fail --silent -H 'Content-Type: application/json' -d '{"name":"Persistence Test","email":"persistence@example.com","course":"DevOps"}' http://localhost:8080/students | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          docker compose restart app
          python3 scripts/smoke-test.py
          curl --fail --silent "http://localhost:8080/students/$STUDENT_ID" | python3 -c 'import json,sys; assert json.load(sys.stdin)["name"] == "Persistence Test"'
          curl --fail --silent -X DELETE "http://localhost:8080/students/$STUDENT_ID"
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
      - name: Clean up CI resources
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
